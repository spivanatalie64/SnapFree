name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/generate-index.js
      - run: snapcraft lint --help 2>&1 | head -n 5 || echo "snapcraft not installed — skipping lint"
