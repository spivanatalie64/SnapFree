name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate index
        run: node scripts/generate-index.js
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/search.json docs/repo/index.json || true
          git diff --cached --quiet || { git commit -m "chore: update snap index [skip ci]"; git push origin HEAD:main; }
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a46b418508c26278ae2d3373f41da81
          command: pages deploy docs --project-name snapfree --branch main
